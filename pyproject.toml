[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-av-planning-v4"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "transformers>=4.57,<5", "peft>=0.18", "numpy", "scipy", "Pillow", "soundfile", "av"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
